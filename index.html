<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Schichtübergabe Feinzug 2</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schichtübergabe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c3e50">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sperre" hidden>
  <div class="sperre-box">
    <div class="sperre-logo">SÜ</div>
    <div id="sperre-titel">Code eingeben</div>
    <input type="password" id="sperre-code" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Code">
    <p id="sperre-fehler"></p>
    <button class="btn" id="sperre-ok">Entsperren</button>
  </div>
</div>

<div id="login" hidden>
  <div class="sperre-box">
    <div class="sperre-logo">SÜ</div>
    <div id="login-titel">Anmelden</div>
    <input type="text" id="login-name" autocomplete="username" autocapitalize="none" placeholder="Benutzer">
    <input type="password" id="login-pw" autocomplete="current-password" placeholder="Passwort">
    <p id="login-fehler"></p>
    <button class="btn" id="login-ok">Anmelden</button>
  </div>
</div>

<header id="kopf">
  <h1 id="kopf-titel">Maschinen</h1>
  <button id="fehler-knopf" aria-label="Fehler melden">⚠ Fehler</button>
</header>

<button id="install-banner" type="button">📲 App auf dem Startbildschirm installieren</button>
<button id="update-banner" type="button"></button>
<button id="wochen-banner" type="button"></button>

<main id="inhalt"><!-- wird per JS gefüllt --></main>

<div id="update-dialog" hidden>
  <div class="dialog">
    <h2 id="update-titel"></h2>
    <ul id="update-liste"></ul>
    <button class="btn" id="update-ok">Alles klar</button>
  </div>
</div>

<nav id="tabs">
  <button class="tab" data-view="maschinen"><span class="tab-ico">▦</span>Maschinen</button>
  <button class="tab" data-view="aufgaben"><span class="tab-ico">✓</span>Aufgaben</button>
  <button class="tab" data-view="spulen"><span class="tab-ico">↻</span>Spulen</button>
  <button class="tab" data-view="ruesten"><span class="tab-ico">⚙</span>Rüsten</button>
  <button class="tab" data-view="mehr"><span class="tab-ico">≡</span>Mehr</button>
</nav>

<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
